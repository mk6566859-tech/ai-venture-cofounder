# Streamlit Secrets Template for AI Venture Co-Founder
# Copy this file to .streamlit/secrets.toml and fill in your actual API key.
# In Streamlit Community Cloud, enter these key-value pairs directly in the App Secrets settings.

LLM_PROVIDER = "groq"
LLM_MODEL = "openai/gpt-oss-120b"
GROQ_API_KEY = "gsk_your_groq_api_key_here"

# Optional overrides
EMBEDDING_MODEL = "sentence-transformers/all-MiniLM-L6-v2"
TEMPERATURE = 0.2
